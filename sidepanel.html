<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GUTO</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/guto-theme.css?v=1"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><style> /* CHAT TEST MODE BUTTON */ .chat-test-btn { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%) !important; color: #fff !important; border: 1px solid #6d28d9 !important; font-weight: 600; letter-spacing: 0.02em; position: relative; overflow: hidden; } .chat-test-btn::before { content: ''; position: absolute; top: -50%; left: -60%; width: 40%; height: 200%; background: rgba(255,255,255,0.15); transform: skewX(-20deg); pointer-events: none; transition: left 0.4s; } .chat-test-btn:hover::before { left: 120%; } .chat-test-btn:hover { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%) !important; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(124,58,237,0.45) !important; } .chat-test-btn.active { background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%) !important; box-shadow: 0 0 0 2px rgba(124,58,237,0.5), 0 4px 14px rgba(124,58,237,0.4) !important; color: #fff !important; } /* COUNTDOWN INFO PANEL */ .license-expiry-card { background: rgba(255, 255, 255, 0.03); border: 1px dashed rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 0.9em; text-align: center; color: var(--text-secondary); display: none; } .license-expiry-card.visible { display: block; } .license-expiry-time { font-family: monospace; font-weight: bold; color: #ff5252; margin-top: 4px; font-size: 1.1em; } </style></head><body><div class="app-container license-locked" id="appContainer"><header class="glass-header"><div class="logo-area"><img src="images/guto-avatar.png" alt="Logo" class="app-logo"><div><h1>GUTO</h1></div></div><div class="lang-flags-wrap" id="langFlagsWrap"><button class="lang-flag-btn active" id="langBtnPt" data-lang="pt" title="Português (Brasil)"><img src="images/flag_brazil.png" alt="BR" class="lang-flag-img"></button><button class="lang-flag-btn" id="langBtnEn" data-lang="en" title="English (USA)"><img src="images/flag_usa.png" alt="EN" class="lang-flag-img"></button><button class="lang-flag-btn" id="langBtnTr" data-lang="tr" title="Türkçe"><img src="images/flag_turkey.png" alt="TR" class="lang-flag-img"></button></div><div class="status-indicator disconnected" id="statusBadge" title="Licença obrigatória para liberar o GUTO."><i class="fas fa-link"></i></div></header><div class="debug-panel" id="debugPanel"><div class="debug-item"><span class="label">PROJ:</span><span class="value" id="debugProject">---</span></div><div class="debug-item"><span class="label">AUTH:</span><span class="value" id="debugAuth">---</span></div><div class="debug-item"><span class="label">LOVE:</span><span class="value" id="debugLove">---</span></div></div><div class="license-gate" id="licenseGate"><div class="license-gate-panel"><div class="license-gate-hero"><img src="images/guto-avatar.png" class="license-gate-mascot" alt="GUTO"><div class="license-gate-copy"><span class="license-gate-badge">GutoSecurity v1</span><h2>Desbloqueie o GUTO</h2><p>Valide sua licença para liberar o painel e enviar comandos ao Lovable.</p></div></div><div class="input-group license-input-wrap"><i class="fas fa-key icon"></i><input type="text" id="licenseKey" placeholder="Cole sua chave de licença" spellcheck="false" autocomplete="off"></div><div class="connection-buttons license-actions"><button id="connectBtn" class="btn-connect">Validar chave</button><button id="disconnectBtn" class="btn-disconnect hidden">Remover chave</button></div><div id="connectionStatus" class="status-message">Licença obrigatória para usar o GUTO.</div></div></div><div class="chat-history" id="chatHistory"><div class="chat-message system"><div class="message-content"> Valide sua licença GUTO para começar. </div></div></div><div class="input-area glass-footer"><div class="license-expiry-card" id="licenseExpiryCard">Sua licença expira em: <div class="license-expiry-time" id="licenseExpiryTime">--:--:--</div></div><div id="filePreviewContainer" class="file-preview-container" style="display:none;"></div><div class="composer-mode-bar" id="composerModeBar"><button id="visualModeBtn" class="composer-mode-btn active" type="button">Modo Chat</button><button id="turboModeBtn" class="composer-mode-btn" type="button">Modo Thinking Beta</button></div><textarea id="userCommand" placeholder="Send a command to Lovable..."></textarea><div class="action-bar"><button id="clearHistoryBtn" class="btn-icon" title="Clear History"><i class="fas fa-trash"></i></button><button id="attachBtn" class="btn-icon" title="Attach File"><i class="fas fa-paperclip"></i></button><button id="micBtn" class="btn-icon" title="Voice Input"><i class="fas fa-microphone"></i></button><div class="spacer"></div><button id="manualCreateProjectBtn" class="btn-icon" title="Create New Project"><i class="fas fa-folder-plus"></i></button><button id="sendBtn" class="btn-send" disabled><i class="fas fa-paper-plane"></i></button></div></div><div id="imageModal" class="image-modal" style="display:none;"><span class="close-modal" id="closeImageModal">&times;</span><img class="modal-img" id="modalImg"></div></div><script src="js/i18n.js"></script><script src="js/send-engine.js"></script><script src="js/visual-upload-payload-fix.js"></script><script src="js/sidepanel.js"></script><script src="js/project-create-fix.js"></script><script src="js/guto-extras.js"></script><script src="js/auto-updater.js"></script></body></html>
